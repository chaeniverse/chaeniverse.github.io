# Study notes. The full posts are written in Korean and live on the Korean
# site at /kor/blog/<slug>/. Newest first within each group.

groups:
  - title: causal inference & clinical biostatistics
    items:
      - slug: causal-inference
        date: 2025-08-26
        title: "Causal Inference: PSM, IPTW, CCW, and Target Trial Emulation"
        summary: "From the counterfactual framework to propensity score matching, stabilized and truncated IPTW, balance diagnostics, robust sandwich estimators, clone-censor weighting and target trial emulation — with practical code."
      - slug: survival-analysis
        date: 2025-03-31
        title: "Survival Analysis: Exposure Period, Immortal Time Bias, Fine–Gray"
        summary: "Practical notes on clinical survival analysis: the immortal time bias created by using drug initiation as the index date, correcting it with an exposure period, and cause-specific vs. Fine–Gray models with MatchIt code."
      - slug: competing-risk-analysis
        date: 2024-03-15
        title: "Competing Risk Analysis"
        summary: "Accounting for events that compete with the event of interest: cause-specific vs. Fine–Gray subdistribution models, and options for matching."

  - title: machine learning
    items:
      - slug: ml-classification-workflow
        date: 2024-10-24
        title: "A Step-by-Step Workflow for ML Classification Projects"
        summary: "A practical guide covering variable exploration, missing data, multicollinearity, encoding, scaling, feature selection, modeling and evaluation."
      - slug: logistic-regression
        date: 2024-09-22
        title: "Logistic Regression"
        summary: "Why logistic regression has no closed-form solution: likelihood, MLE, gradient descent, and sigmoid-based prediction and classification."
      - slug: mlp-multi-layer-perceptron
        date: 2024-09-21
        title: "MLP (Multi-Layer Perceptron)"
        summary: "Combining perceptrons to overcome the limits of a single one: the role of hidden nodes, solving XOR, and backpropagation."
      - slug: xgboost
        date: 2024-09-21
        title: "XGBoost"
        summary: "What makes gradient boosting fast and scalable in XGBoost: approximate split finding, sparsity-aware splits, and column-wise pre-sorted system design."
      - slug: svm-part-1
        date: 2024-09-20
        title: "SVM (Support Vector Machine)"
        summary: "The basics of SVMs: the linear classifier objective, deriving the margin width, margin and VC dimension, and the primal-to-dual derivation of the hard-margin SVM."
      - slug: random-forest
        date: 2024-09-19
        title: "Random Forest"
        summary: "Bagging with decision trees plus random feature selection at each split: the generalization error bound and OOB-based variable importance."

  - title: deep learning & generative models
    items:
      - slug: diffusion-models-ddpm-derivation
        date: 2024-05-28
        title: "Diffusion Models: Deriving DDPM and Its Extensions (DDIM, LDM)"
        summary: "From the intuition of forward and reverse processes to the ELBO-based derivation of the DDPM loss, and follow-up models such as DDIM, Diffusion-GAN and LDM."

  - title: sampling & Bayesian computation
    items:
      - slug: acceptance-rejection
        date: 2024-09-07
        title: "Acceptance–Rejection Algorithm"
        summary: "Sampling from a hard distribution by scattering uniform points and keeping only those under the curve — explained step by step with geometric intuition."
      - slug: mcmc-metropolis-hastings
        date: 2024-09-07
        title: "MCMC (Metropolis–Hastings)"
        summary: "Collecting samples from a complex distribution by moving a proposal distribution and accepting or rejecting each step, visualized on a multimodal example."
      - slug: mcmc-gibbs-sampling
        date: 2023-12-18
        title: "MCMC (Gibbs Sampling)"
        summary: "Deriving Gibbs sampling step by step on a normal–inverse-gamma model for posteriors with no closed form, and writing it up as an algorithm."
      - slug: importance-sampling
        date: 2023-01-17
        title: "Importance Sampling"
        summary: "Estimating expectations by sampling from an easier distribution φ(x) and reweighting by f(x)/φ(x), building up from basic Monte Carlo."
      - slug: inverse-sampling
        date: 2023-01-11
        title: "Inverse Transform Sampling"
        summary: "Sampling from any distribution with the inverse CDF and U(0, 1), with its geometric intuition."

  - title: statistical inference & optimization
    items:
      - slug: newton-raphson-gradient
        date: 2023-01-27
        title: "Newton–Raphson Method & Gradient Method"
        summary: "Two iterative methods that follow the curve toward a root or an extremum, compared on the same example y = x²."
      - slug: likelihood-ratio-test
        date: 2023-01-17
        title: "Likelihood Ratio Test"
        summary: "Using the ratio of maximized likelihoods under the null and alternative as a test statistic: definition, rejection region, and a normal-mean example that reduces to the t-test."
      - slug: permutation-test
        date: 2022-11-03
        title: "Permutation Test"
        summary: "A non-parametric test for small or non-normal samples: if two samples come from the same distribution, shuffling them should not change it. Procedure and p-value computation."
      - slug: rao-blackwell-theorem
        date: 2022-10-31
        title: "Rao–Blackwell Theorem"
        summary: "Conditioning an unbiased estimator on a sufficient statistic, E(T | S), never increases variance — definition and a proof via the law of total variance."
